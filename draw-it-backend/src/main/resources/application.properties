spring.application.name=draw-it-backend

# Database Configuration
#local  : localhost 6603
spring.datasource.url=jdbc:mysql://my-mysql:3306/drawitdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=drawit-user
spring.datasource.password=tai123
# spring.datasource.password=tai123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.session.cookie.same-site=none
# Set true in production with HTTPS
server.servlet.session.cookie.secure=false

# CORS Configuration
#local
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
#production
#spring.web.cors.allowed-origins=http://localhost:3000

#REDIS
spring.data.redis.host=localhost
spring.data.redis.port= 6379
# Leave empty for local dev
spring.data.redis.password=


# Hugging Face API
huggingface.api.url=https://api-inference.huggingface.co/models
huggingface.api.token=${HUGGINGFACE_TOKEN:your_token_here}


