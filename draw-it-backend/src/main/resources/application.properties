spring.application.name=draw-it-backend

# Database Configuration
#local  : localhost 6033
spring.datasource.url=jdbc:mysql://localhost:6033/drawit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=drawit_user
spring.datasource.password=tai123
# spring.datasource.password=tai123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.session.cookie.same-site=none
# Set true in production with HTTPS
server.servlet.session.cookie.secure=false

# CORS Configuration
#local
spring.web.cors.allowed-origins=*
#spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
#spring.web.cors.allowed-headers=*
#production
#spring.web.cors.allowed-origins=http://localhost:3000

#REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Leave empty for local dev
spring.data.redis.password=


# Hugging Face API
#huggingface.api.url=https://router.huggingface.co/hf-inference/models
huggingface.api.url=https://router.huggingface.co/v1/chat/completions
huggingface.api.token=${HUGGINGFACE_TOKEN:token}


#logging
logging.level.org.springframework.messaging=trace
logging.level.org.springframework.web.socket=trace