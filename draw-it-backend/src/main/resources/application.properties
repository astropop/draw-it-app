spring.application.name=draw-it-backend

# Database Configuration
#local  : localhost 6033
spring.datasource.url=jdbc:mysql://${DRAWIT_DB_URL:localhost}:${DRAWIT_DB_PORT:1}/${DRAWIT_DB_SCHEMA:drawit_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DRAWIT_DB_USER:user}
spring.datasource.password=${DRAWIT_DB_PASS:pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8082
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false

# CORS Configuration
#local
spring.web.cors.allowed-origins=*
#spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
#spring.web.cors.allowed-headers=*

#REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:2}
# Leave empty for local dev
spring.data.redis.password=${REDIS_PASS:pwredis}


# Hugging Face API
#huggingface.api.url=https://router.huggingface.co/hf-inference/models
huggingface.api.url=https://router.huggingface.co/v1/chat/completions
huggingface.api.token=${DRAWIT_HUGGINGFACE_TK:token}
